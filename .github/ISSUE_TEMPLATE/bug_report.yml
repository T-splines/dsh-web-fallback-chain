name: Bug report
description: Something went wrong — behaviour, crash, wrong fallback, stuck breaker
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Three details decide most of these cases, so
        please fill in as much as you can — a report with them is usually fixed
        the same day.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what actually happened.
      placeholder: |
        Expected: the chain falls back to the next target after eco returns 400.
        Actual: the whole turn failed with INVALID_REQUEST.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin version
      description: "`npm ls @magic6/dsh-web-fallback-chain` in your profile, or the number in the market."
      placeholder: "0.2.5"
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DSH version and how you run it
      description: The harness version, plus `web` / `desktop` / `headless` / `tui`.
      placeholder: "0.2.1-rc.2, dsh web, macOS 26 arm64"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and architecture
      description: Web search/read behaviour differs per provider and per platform, so it matters.
      placeholder: "Windows 11 x64 / macOS 26 arm64 / Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: The error, verbatim
      description: |
        The exact `code` and `message` from the failure, not a paraphrase.
        Session logs carry them: `plugin:web-fallback-chain` records and
        the failing tool result.
      render: text
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Your `web-fallback` config
      description: |
        The relevant block from your profile's `cordis.patch.yml`.
        **Remove API keys and base URLs you do not want public.**
      render: yaml
    validations:
      required: false

  - type: textarea
    id: provider-response
    attributes:
      label: What the provider answered
      description: |
        The HTTP status and body from the failing provider, if you have it.
        "it returned nothing" and "it returned 429 with a message" lead to
        completely different fixes.
      render: text
    validations:
      required: false
